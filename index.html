<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#dfe8e3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- (Home Screen: iOS takes its name and icon from these, not the
         manifest. The icon is full-bleed; iOS rounds its corners.) -->
    <meta name="apple-mobile-web-app-title" content="Meals" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- (The page draws behind the status bar itself — the counter's colour,
         see App — rather than iOS drawing a bar over it, whose edge recent
         iOS blurs. iOS picks the status bar's text colour to suit.) -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Meals</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
