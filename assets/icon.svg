    <!-- spoon: an egg-shaped bowl, rounded into its neck -->
    <path d="M320 92 C350 92 365 122 365 160 C365 200 346 228 333 240 C327 246 326.5 258 326.5 278 C327.5 322 333 372 333 402 A13 13 0 0 1 307 402 C307 372 312.5 322 313.5 278 C313.5 258 313 246 307 240 C294 228 275 200 275 160 C275 122 290 92 320 92Z" />
  </g>
</svg>
